[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrapredict5"
version = "0.1.0"
description = "HydraPredict 5 backtesting and execution platform"
requires-python = ">=3.10"
dependencies = [
  "ccxt>=4.4",
  "hmmlearn>=0.3.3",
  "alpaca-py>=0.38",
  "lightgbm>=4.6",
  "matplotlib>=3.10",
  "numpy>=2.1",
  "optuna>=4.5",
  "pandas>=2.2",
  "plotly>=6.0",
  "polars>=1.39",
  "python-dotenv>=1.1",
  "scikit-learn>=1.6",
  "streamlit>=1.44",
  "streamlit-authenticator>=0.4",
  "streamlit-autorefresh>=1.0",
  "psutil>=6.1",
  "statsmodels>=0.14",
  "yfinance>=0.2",
]

[tool.setuptools.packages.find]
include = ["quant_stack*"]

[tool.pytest.ini_options]
pythonpath = ["."]
